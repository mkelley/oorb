name: Build and upload release to PyPI

on:
  release:
    types:
      - published
  # delete after testing
  pull_request:
    branches: [master]

jobs:
  oorb_data:
    uses: ./.github/workflows/oorb_data.yml

  wheels:
    name: Build ${{ matrix.pyversion }}/${{ matrix.os }}/${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest] #, macos-latest]
        pyversion: [cp314]
        architecture: [x86_64] #, aarch64, arm64]
        exclude:
          - os: ubuntu
            architecture: arm64
          - os: macos
            architecture: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python for cibuildwheel
        uses: actions/setup-python@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: "${{ matrix.pyversion }}-*"
          CIBW_ARCHS: "${{ matrix.architecture }}"
        with:
          output-dir: wheelhouse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.architecture }}
          path: wheelhouse/*.whl

  test-wheels:
    name: Test ${{ matrix.pyversion }}/${{ matrix.os }}/${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest] #, macos-latest]
        pyversion: ["3.14"]
        architecture: [x86_64] #, aarch64, arm64]
        exclude:
          - os: ubuntu
            architecture: arm64
          - os: macos
            architecture: aarch64
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyversion }}

      # checkout code specifically for python/test.py
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ./_oorb

      - name: Get wheels
        uses: actions/download-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.architecture }}
          path: /tmp/artifacts/wheels

      - name: Restore cached ephemeris data
        uses: actions/cache/restore@v4
        with:
          key: oorb_data
          path: /tmp/artifacts/oorb_data/

      - name: Setup QEMU for aarch64
        if: matrix.architecture == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run aarch64 tests in container
        if: matrix.architecture == 'aarch64'
        # Runs in emulation, so this can be very slow!
        run: |
          export DOCKER_IMAGE="arm64v8/python:${{ matrix.pyversion }}"
          docker pull --platform linux/arm64 $DOCKER_IMAGE
          docker run \
            --platform linux/arm64 \
            --volume /tmp/artifacts:/tmp/artifacts \
            --volume $PWD/_oorb:/tmp/oorb_latest \
            --env OORB_DATA=/tmp/artifacts/oorb_data \
            $DOCKER_IMAGE \
            /bin/bash -c "
            pip install --no-index --no-deps --find-links /tmp/artifacts/wheels pyoorb && \
            pip install --find-links /tmp/artifacts/wheels pyoorb && \
            python /tmp/oorb_latest/python/test.py"

      - name: Install pyoorb from wheel
        if: ${{ matrix.architecture != 'aarch64' }}
        run: |
          # First, install with --no-index to make sure we don't hit up PyPI and only
          # use the local wheel. Use --no-deps, because we don't have a local copy of
          # any dependencies.
          pip install --no-index --no-deps --find-links /tmp/artifacts/wheels pyoorb
          # Now that we are sure the local wheel works, install dependencies by repeating
          # the command, but this time allowing the index and deps.
          pip install --find-links /tmp/artifacts/wheels pyoorb

      - name: Try importing pyoorb
        if: ${{ matrix.architecture != 'aarch64' }}
        run: |
          export OORB_DATA=/tmp/artifacts/oorb_data
          python -c "import pyoorb; print('success.')"

      - name: Execute tests
        if: ${{ matrix.architecture != 'aarch64' }}
        run: |
          export OORB_DATA=/tmp/artifacts/oorb_data
          python ./_oorb/python/test.py

